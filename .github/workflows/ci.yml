name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true
      - name: make check (fmt, vet, lint, tests + coverage gate, rules drift)
        run: make check
      - name: promtool check + test rules
        run: make promtool promtool-check
      - name: demo
        run: make demo
