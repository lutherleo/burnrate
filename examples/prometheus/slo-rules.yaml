        expr: |
          (
            slo:sli_error:ratio_rate1d{slo="checkout-latency"} > (3 * (1 - 0.99))
          and
            slo:sli_error:ratio_rate2h{slo="checkout-latency"} > (3 * (1 - 0.99))
          )
          or
          (
            slo:sli_error:ratio_rate3d{slo="checkout-latency"} > (1 * (1 - 0.99))
          and
            slo:sli_error:ratio_rate6h{slo="checkout-latency"} > (1 * (1 - 0.99))
          )
        labels:
          service: checkout
          severity: ticket
          slo: checkout-latency
          team: payments
        annotations:
          description: 'SLO checkout-latency of service checkout (objective 99% over 30d) exceeds the ticket burn-rate thresholds: 1d/2h at 3x or 3d/6h at 1x.'
          summary: Checkout latency under 250ms is burning its error budget too fast (ticket)
