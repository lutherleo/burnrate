# Generated by burnrate from examples/slos/checkout.yaml, examples/slos/search.yaml.
# Do not edit by hand: change the SLO definitions and regenerate.
groups:
  - name: burnrate-checkout-availability
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[5m])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[5m])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate30m
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[30m])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[30m])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate1h
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[1h])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[1h])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate2h
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[2h])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[2h])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate6h
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[6h])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[6h])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate1d
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[1d])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[1d])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate3d
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[3d])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[3d])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:sli_error:ratio_rate30d
        expr: clamp_max((sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code=~"5.."}[30d])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout"}[30d])) > 0), 1)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:error_budget:ratio
        expr: vector(1 - 0.999)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:error_budget_remaining:ratio
        expr: 1 - slo:sli_error:ratio_rate30d{slo="checkout-availability"} / (1 - 0.999)
        labels:
          service: checkout
          slo: checkout-availability
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-availability"} >= 0.5) + 1
        labels:
          service: checkout
          slo: checkout-availability
          state: healthy
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-availability"} >= 0.25 < 0.5) + 1
        labels:
          service: checkout
          slo: checkout-availability
          state: warning
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-availability"} > 0 < 0.25) + 1
        labels:
          service: checkout
          slo: checkout-availability
          state: critical
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-availability"} <= 0) + 1
        labels:
          service: checkout
          slo: checkout-availability
          state: exhausted
          team: payments
      - alert: ErrorBudgetBurn
        expr: |
          (
            slo:sli_error:ratio_rate1h{slo="checkout-availability"} > (14.4 * (1 - 0.999))
          and
            slo:sli_error:ratio_rate5m{slo="checkout-availability"} > (14.4 * (1 - 0.999))
          )
          or
          (
            slo:sli_error:ratio_rate6h{slo="checkout-availability"} > (6 * (1 - 0.999))
          and
            slo:sli_error:ratio_rate30m{slo="checkout-availability"} > (6 * (1 - 0.999))
          )
        labels:
          service: checkout
          severity: page
          slo: checkout-availability
          team: payments
        annotations:
          description: 'SLO checkout-availability of service checkout (objective 99.9% over 30d) exceeds the page burn-rate thresholds: 1h/5m at 14.4x or 6h/30m at 6x.'
          runbook_url: https://runbooks.example.internal/checkout/availability
          summary: Checkout availability is burning its error budget too fast (page)
      - alert: ErrorBudgetBurn
        expr: |
          (
            slo:sli_error:ratio_rate1d{slo="checkout-availability"} > (3 * (1 - 0.999))
          and
            slo:sli_error:ratio_rate2h{slo="checkout-availability"} > (3 * (1 - 0.999))
          )
          or
          (
            slo:sli_error:ratio_rate3d{slo="checkout-availability"} > (1 * (1 - 0.999))
          and
            slo:sli_error:ratio_rate6h{slo="checkout-availability"} > (1 * (1 - 0.999))
          )
        labels:
          service: checkout
          severity: ticket
          slo: checkout-availability
          team: payments
        annotations:
          description: 'SLO checkout-availability of service checkout (objective 99.9% over 30d) exceeds the ticket burn-rate thresholds: 1d/2h at 3x or 3d/6h at 1x.'
          runbook_url: https://runbooks.example.internal/checkout/availability
          summary: Checkout availability is burning its error budget too fast (ticket)
  - name: burnrate-checkout-latency
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: clamp_min(1 - (sum(rate(http_server_request_duration_seconds_bucket{job="checkout", http_response_status_code!~"5..", le="0.25"}[5m])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code!~"5.."}[5m])) > 0), 0)
