        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:sli_error:ratio_rate3d
        expr: clamp_min(1 - (sum(rate(http_server_request_duration_seconds_bucket{job="checkout", http_response_status_code!~"5..", le="0.25"}[3d])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code!~"5.."}[3d])) > 0), 0)
        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:sli_error:ratio_rate30d
        expr: clamp_min(1 - (sum(rate(http_server_request_duration_seconds_bucket{job="checkout", http_response_status_code!~"5..", le="0.25"}[30d])) or vector(0)) / (sum(rate(http_server_request_duration_seconds_count{job="checkout", http_response_status_code!~"5.."}[30d])) > 0), 0)
        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:error_budget:ratio
        expr: vector(1 - 0.99)
        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:error_budget_remaining:ratio
        expr: 1 - slo:sli_error:ratio_rate30d{slo="checkout-latency"} / (1 - 0.99)
        labels:
          service: checkout
          slo: checkout-latency
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-latency"} >= 0.4) + 1
        labels:
          service: checkout
          slo: checkout-latency
          state: healthy
          team: payments
      - record: slo:error_budget_policy_state
        expr: 0 * (slo:error_budget_remaining:ratio{slo="checkout-latency"} > 0 < 0.4) + 1
        labels:
